<div class="layout-topbar">
    <div class="topbar-start">
        <a class="app-logo" routerLink="/">
            <img alt="app logo" [src]="logo">
            <span class="app-name">SmartPos</span>
        </a>

        <button #menubutton class="topbar-menubutton p-link" type="button" (click)="onMenuButtonClick()">
            <span></span>
        </button>

        <a
            class="p-link hidden sm:flex align-items-center px-3 py-2 border-round hover:surface-hover font-medium white-space-nowrap"
            routerLink="/"
        >
            Home
        </a>

        <ul class="topbar-menu">
            <li *ngFor="let item of tabs; let i = index">
                <a
                    [routerLink]="item.routerLink"
                    routerLinkActive="active-route"
                    [routerLinkActiveOptions]="item.routerLinkActiveOptions || { paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }"
                    [fragment]="item.fragment"
                    [queryParamsHandling]="item.queryParamsHandling"
                    [preserveFragment]="item.preserveFragment!"
                    [skipLocationChange]="item.skipLocationChange!"
                    [replaceUrl]="item.replaceUrl!"
                    [state]="item.state"
                    [queryParams]="item.queryParams"
                >
                    <span>{{ item.label }}</span>
                </a>
                <i class="pi pi-times" (click)="removeTab($event, item, i)"></i>
            </li>
        </ul>
    </div>

    <div class="topbar-center">
        <div class="topbar-branch relative" *ngIf="branches?.length">
            <button
                class="p-link flex align-items-center gap-2 px-3 py-2 border-round hover:surface-hover"
                type="button"
                pStyleClass="@next"
                enterClass="hidden"
                enterActiveClass="scalein"
                leaveToClass="hidden"
                leaveActiveClass="fadeout"
                [hideOnOutsideClick]="true"
                [disabled]="changingBranch || !canSwitchLocations || branches.length <= 1"
            >
                <i class="pi pi-map-marker text-xl"></i>
                <span class="hidden sm:inline text-sm text-500 white-space-nowrap">Branch</span>
                <span class="font-medium white-space-nowrap">
                    {{ locationLabel }}
                </span>
                <span
                    *ngIf="currentBranch?.status && currentBranch?.status !== BranchStatuses.Approved"
                    class="text-xs px-2 py-1 border-round font-medium"
                    [ngClass]="{
                        'bg-orange-100 text-orange-700': currentBranch?.status === BranchStatuses.Pending,
                        'bg-red-100 text-red-700': currentBranch?.status === BranchStatuses.Rejected
                    }"
                >{{ currentBranch?.status }}</span>
                <i class="pi pi-angle-down" *ngIf="canSwitchLocations && branches.length > 1"></i>
            </button>
            <ul
                class="list-none p-2 m-0 border-round shadow-2 hidden absolute surface-overlay origin-top mt-2 left-0 top-auto z-5"
                style="min-width: 16rem; max-height: 20rem; overflow: auto"
                *ngIf="canSwitchLocations && branches.length > 1"
            >
                <li *ngFor="let branch of branches">
                    <a
                        pRipple
                        class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer gap-2"
                        [class.surface-hover]="branch.id === currentBranch?.id"
                        (click)="onChangeBranch(branch)"
                    >
                        <span class="flex-1">
                            <span class="block font-medium">{{ branch.name }}</span>
                            <span class="text-xs text-500" *ngIf="branch.code">{{ branch.code }}</span>
                            <span
                                class="text-xs text-500 block"
                                *ngIf="isHostAdmin && branch.tenancyName"
                            >{{ branch.tenancyName }}</span>
                        </span>
                        <span class="text-xs text-500" *ngIf="branch.status">{{ branch.status }}</span>
                        <i
                            class="pi pi-check text-primary"
                            *ngIf="branch.id === currentBranch?.id"
                        ></i>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="topbar-end">
        <div class="topbar-profile">
            <button
                class="topbar-profile-button p-link"
                type="button"
                pStyleClass="@next"
                enterClass="hidden"
                enterActiveClass="scalein"
                leaveToClass="hidden"
                leaveActiveClass="fadeout"
                [hideOnOutsideClick]="true"
            >
                <img
                    *ngIf="hasUserImage && userImage"
                    alt="avatar"
                    [src]="userImage"
                    (error)="onImageError()"
                    class="profile-avatar border-circle"
                />
                <span
                    *ngIf="!hasUserImage || !userImage"
                    class="profile-avatar profile-initials border-circle"
                    aria-hidden="true"
                >
                    {{ userInitials }}
                </span>
                <span class="profile-details">
                    <span class="profile-name">{{ userDisplayName }}</span>
                    <span class="profile-job">{{ userRole }}</span>
                </span>
                <i class="pi pi-angle-down"></i>
            </button>
            <ul
                class="list-none p-3 m-0 border-round shadow-2 hidden absolute surface-overlay origin-top w-full sm:w-12rem mt-2 right-0 top-auto"
            >
                <li>
                    <a
                        pRipple
                        class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer"
                        routerLink="/auth/changepassword"
                    >
                        <i class="pi pi-key mr-3"></i>
                        <span>Change Password</span>
                    </a>
                    <a
                        pRipple
                        class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer"
                        (click)="onSignOut()"
                    >
                        <i class="pi pi-power-off mr-3"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
<p-toast></p-toast>
