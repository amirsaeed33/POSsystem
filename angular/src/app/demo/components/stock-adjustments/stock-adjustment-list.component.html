<div class="card">
    <p-table
        #dt
        [value]="adjustments"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['referenceNo', 'notes']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search stock adjustments"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-primary w-full sm:w-auto flex-order-0 sm:flex-order-1 font-semibold"
                    (click)="openCreateDialog()"
                    [disabled]="!canCreate"
                    [pTooltip]="!canCreate ? 'You do not have permission to Create' : ''"
                    tooltipPosition="top"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="referenceNo">
                    Reference No <p-sortIcon field="referenceNo"></p-sortIcon>
                </th>
                <th pSortableColumn="adjustmentDate">
                    Adjustment Date <p-sortIcon field="adjustmentDate"></p-sortIcon>
                </th>
                <th pSortableColumn="reason">
                    Reason <p-sortIcon field="reason"></p-sortIcon>
                </th>
                <th pSortableColumn="notes">
                    Notes <p-sortIcon field="notes"></p-sortIcon>
                </th>
                <th style="width: 10rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ item.referenceNo || ('#' + item.id) }}</td>
                <td>{{ item.adjustmentDate | date: 'mediumDate' }}</td>
                <td>{{ reasonLabel(item.reason) }}</td>
                <td>{{ item.notes || '—' }}</td>
                <td>
                    <div class="flex gap-2">
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-eye"
                            class="tbl-action-btn view-btn"
                            pTooltip="View Details"
                            tooltipPosition="top"
                            (click)="openViewDialog(item)"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-pencil"
                            class="tbl-action-btn edit-btn"
                            [pTooltip]="!canEdit ? 'You do not have permission to Edit' : 'Edit'"
                            tooltipPosition="top"
                            (click)="openEditDialog(item)"
                            [disabled]="!canEdit"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-trash"
                            class="tbl-action-btn delete-btn"
                            [pTooltip]="!canDelete ? 'You do not have permission to Delete' : 'Delete'"
                            tooltipPosition="top"
                            (click)="onDelete(item)"
                            [disabled]="!canDelete"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-4">
                    <div class="text-500">No stock adjustments found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-stock-adjustment-form-dialog
        [(visible)]="formDialogVisible"
        [adjustmentId]="editingAdjustmentId"
        (saved)="onDialogSaved()"
    ></app-stock-adjustment-form-dialog>

    <app-stock-adjustment-view-dialog
        [(visible)]="viewDialogVisible"
        [adjustmentId]="viewingAdjustmentId"
    ></app-stock-adjustment-view-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
