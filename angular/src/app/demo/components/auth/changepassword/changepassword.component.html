<div
    class="surface-ground h-screen w-screen flex align-items-center justify-content-center"
    [ngClass]="{ 'p-input-filled': filledInput }"
>
    <div
        class="surface-card py-7 px-5 sm:px-7 shadow-2 flex flex-column w-11 sm:w-30rem"
        style="border-radius: 14px"
    >
        <h1 class="font-bold text-2xl mt-0 mb-2">Update Password</h1>
        <p class="text-color-secondary mb-4">
            Enter your current password and choose a new one.
        </p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
            <div class="mb-4">
                <label for="currentPassword" class="block mb-2">Current Password</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-lock"></i>
                    <input
                        id="currentPassword"
                        type="password"
                        pInputText
                        class="w-full"
                        formControlName="currentPassword"
                        maxlength="32"
                        style="padding-left: 2.5rem"
                    />
                </span>
                <small
                    class="p-error block mt-1"
                    *ngIf="form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched"
                >
                    Current password is required (2–32 characters).
                </small>
            </div>

            <div class="mb-4">
                <label for="newPassword" class="block mb-2">New Password</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-key"></i>
                    <input
                        id="newPassword"
                        type="password"
                        pInputText
                        class="w-full"
                        formControlName="newPassword"
                        maxlength="32"
                        style="padding-left: 2.5rem"
                    />
                </span>
                <small
                    class="p-error block mt-1"
                    *ngIf="form.get('newPassword')?.errors?.['required'] && form.get('newPassword')?.touched"
                >
                    New password is required.
                </small>
                <small
                    class="p-error block mt-1"
                    *ngIf="form.get('newPassword')?.errors?.['pattern'] && form.get('newPassword')?.touched"
                >
                    Passwords must be at least 8 characters and contain a lowercase letter, uppercase letter, and number.
                </small>
            </div>

            <div class="mb-4">
                <label for="confirmNewPassword" class="block mb-2">Confirm New Password</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-key"></i>
                    <input
                        id="confirmNewPassword"
                        type="password"
                        pInputText
                        class="w-full"
                        formControlName="confirmNewPassword"
                        maxlength="32"
                        style="padding-left: 2.5rem"
                    />
                </span>
                <small
                    class="p-error block mt-1"
                    *ngIf="form.get('confirmNewPassword')?.invalid && form.get('confirmNewPassword')?.touched"
                >
                    Confirm password is required.
                </small>
                <small
                    class="p-error block mt-1"
                    *ngIf="form.hasError('passwordsDoNotMatch') && form.get('confirmNewPassword')?.touched"
                >
                    Passwords do not match.
                </small>
            </div>

            <button
                type="submit"
                pButton
                pRipple
                class="w-full"
                label="Save"
                [loading]="saving"
                [disabled]="form.invalid || saving"
            ></button>
        </form>

        <p-toast></p-toast>
    </div>
</div>

<app-config [minimal]="true"></app-config>
