<div class="card">
    <p-table
        #dt
        [value]="suppliers"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['name', 'phone', 'email', 'address']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search suppliers"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-primary w-full sm:w-auto flex-order-0 sm:flex-order-1 font-semibold"
                    (click)="openCreateDialog()"
                    [disabled]="!canCreate"
                    [pTooltip]="!canCreate ? 'You do not have permission to Create' : ''"
                    tooltipPosition="top"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="phone">Phone <p-sortIcon field="phone"></p-sortIcon></th>
                <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
                <th pSortableColumn="address">Address <p-sortIcon field="address"></p-sortIcon></th>
                <th pSortableColumn="balance">Balance <p-sortIcon field="balance"></p-sortIcon></th>
                <th style="width: 8rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-supplier>
            <tr>
                <td>{{ supplier.name }}</td>
                <td>{{ supplier.phone || '—' }}</td>
                <td>{{ supplier.email || '—' }}</td>
                <td>{{ supplier.address || '—' }}</td>
                <td>{{ supplier.balance }}</td>
                <td>
                    <div class="flex gap-2">
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-pencil"
                            class="tbl-action-btn edit-btn"
                            [pTooltip]="!canEdit ? 'You do not have permission to Edit' : 'Edit'"
                            tooltipPosition="top"
                            (click)="openEditDialog(supplier)"
                            [disabled]="!canEdit"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-trash"
                            class="tbl-action-btn delete-btn"
                            [pTooltip]="!canDelete ? 'You do not have permission to Delete' : 'Delete'"
                            tooltipPosition="top"
                            (click)="onDelete(supplier)"
                            [disabled]="!canDelete"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center p-4">
                    <div class="text-500">No suppliers found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-supplier-form-dialog
        [(visible)]="dialogVisible"
        [supplierId]="editingSupplierId"
        (saved)="onDialogSaved()"
    ></app-supplier-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
