<p-dialog
    [header]="dialogTitle"
    [visible]="visible"
    [modal]="true"
    appendTo="body"
    [blockScroll]="true"
    [style]="{ width: '36rem' }"
    [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    (visibleChange)="onVisibleChange($event)"
>
    <div class="flex flex-column gap-3" *ngIf="!loading; else loadingTpl">
        <div class="flex flex-column gap-2">
            <label for="supplierName" class="font-medium">Name <span class="p-error">*</span></label>
            <input id="supplierName" type="text" pInputText class="w-full" maxlength="128"
                [(ngModel)]="supplier.name" [disabled]="saving" />
        </div>

        <div class="flex flex-column gap-2">
            <label for="supplierPhone" class="font-medium">Phone</label>
            <input id="supplierPhone" type="text" pInputText class="w-full" maxlength="32"
                [(ngModel)]="supplier.phone" [disabled]="saving" />
        </div>

        <div class="flex flex-column gap-2">
            <label for="supplierEmail" class="font-medium">Email</label>
            <input id="supplierEmail" type="email" pInputText class="w-full" maxlength="256"
                [(ngModel)]="supplier.email" [disabled]="saving" />
        </div>

        <div class="flex flex-column gap-2">
            <label for="supplierAddress" class="font-medium">Address</label>
            <textarea id="supplierAddress" pInputTextarea rows="2" class="w-full" maxlength="512"
                [(ngModel)]="supplier.address" [disabled]="saving"></textarea>
        </div>

        <div class="flex flex-column gap-2">
            <label for="supplierDescription" class="font-medium">Description</label>
            <textarea id="supplierDescription" pInputTextarea rows="2" class="w-full" maxlength="512"
                [(ngModel)]="supplier.description" [disabled]="saving"></textarea>
        </div>
    </div>

    <ng-template #loadingTpl>
        <div class="flex align-items-center justify-content-center p-4">
            <i class="pi pi-spin pi-spinner text-2xl"></i>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple type="button" label="Cancel" class="p-button-text"
            (click)="onHide()" [disabled]="saving"></button>
        <button pButton pRipple type="button" label="Save" icon="pi pi-check"
            (click)="save()"
            [disabled]="saving || loading || !(supplier.name || '').trim()"
            [loading]="saving"></button>
    </ng-template>
</p-dialog>
