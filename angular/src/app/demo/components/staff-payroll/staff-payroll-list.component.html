<div [ngClass]="{ card: !embedded }">
    <p-table
        #dt
        [value]="records"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['staffName', 'branchName', 'remarks']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-14rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <p-dropdown
                        [options]="staffOptions"
                        [(ngModel)]="staffFilter"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Staff"
                        [showClear]="true"
                        styleClass="w-12rem"
                        (onChange)="onSearch()"
                    ></p-dropdown>
                    <p-dropdown
                        [options]="monthOptions"
                        [(ngModel)]="monthFilter"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Month"
                        styleClass="w-10rem"
                        (onChange)="onSearch()"
                    ></p-dropdown>
                    <p-inputNumber
                        [(ngModel)]="yearFilter"
                        [useGrouping]="false"
                        placeholder="Year"
                        styleClass="w-8rem"
                        inputStyleClass="w-full"
                        (onInput)="onSearch()"
                    ></p-inputNumber>
                    <p-dropdown
                        [options]="paymentStatusOptions"
                        [(ngModel)]="paymentStatusFilter"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Payment"
                        styleClass="w-10rem"
                        (onChange)="onSearch()"
                    ></p-dropdown>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-outlined w-full sm:w-auto flex-order-0 sm:flex-order-1"
                    (click)="openCreateDialog()"
                    [disabled]="!canCreate"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="staffName">Staff <p-sortIcon field="staffName"></p-sortIcon></th>
                <th>Period</th>
                <th pSortableColumn="basicSalary">Basic</th>
                <th pSortableColumn="netSalary">Net</th>
                <th pSortableColumn="paymentStatus">Payment</th>
                <th>Payment Date</th>
                <th pSortableColumn="branchName">Branch</th>
                <th style="width: 8rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
            <tr>
                <td>{{ row.staffName || '—' }}</td>
                <td>{{ monthLabel(row.month) }} {{ row.year }}</td>
                <td>{{ row.basicSalary }}</td>
                <td>{{ row.netSalary }}</td>
                <td>
                    <p-tag
                        [value]="paymentStatusLabel(row.paymentStatus)"
                        [severity]="paymentStatusSeverity(row.paymentStatus)"
                    ></p-tag>
                </td>
                <td>{{ formatDate(row.paymentDate) }}</td>
                <td>{{ row.branchName || '—' }}</td>
                <td>
                    <div class="flex gap-2">
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-pencil"
                            class="p-button-text p-button-sm"
                            pTooltip="Edit"
                            tooltipPosition="top"
                            (click)="openEditDialog(row)"
                            [disabled]="!canEdit"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-trash"
                            class="p-button-text p-button-danger p-button-sm"
                            pTooltip="Delete"
                            tooltipPosition="top"
                            (click)="onDelete(row)"
                            [disabled]="!canDelete"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="8" class="text-center p-4">
                    <div class="text-500">No payroll records found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-staff-payroll-form-dialog
        [(visible)]="dialogVisible"
        [payrollId]="editingId"
        (saved)="onDialogSaved()"
    ></app-staff-payroll-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
