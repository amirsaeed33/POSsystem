<div class="card">
    <p-table
        #dt
        [value]="templates"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['name', 'code', 'subject', 'description']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search templates"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-primary w-full sm:w-auto flex-order-0 sm:flex-order-1 font-semibold"
                    (click)="openCreateDialog()"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="code">Code <p-sortIcon field="code"></p-sortIcon></th>
                <th pSortableColumn="subject">Subject <p-sortIcon field="subject"></p-sortIcon></th>
                <th style="width: 7rem">Active</th>
                <th class="text-center" style="width: 4.5rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-template>
            <tr>
                <td>{{ template.name }}</td>
                <td><code>{{ template.code }}</code></td>
                <td>{{ template.subject }}</td>
                <td>
                    <span
                        class="status-pill"
                        [class.status-pill-on]="template.isActive"
                        [class.status-pill-off]="!template.isActive"
                    >
                        {{ template.isActive ? 'Yes' : 'No' }}
                    </span>
                </td>
                <td class="text-center">
                    <div class="relative flex align-items-center justify-content-center">
                        <button
                            type="button"
                            class="p-link w-2rem h-2rem border-circle inline-flex align-items-center justify-content-center hover:surface-hover transition-colors transition-duration-150"
                            pStyleClass="@next"
                            enterClass="hidden"
                            enterActiveClass="scalein"
                            leaveToClass="hidden"
                            leaveActiveClass="fadeout"
                            [hideOnOutsideClick]="true"
                            pTooltip="Actions"
                            tooltipPosition="left"
                        >
                            <i class="pi pi-ellipsis-v text-color"></i>
                        </button>
                        <ul class="list-none p-2 m-0 border-round shadow-3 hidden absolute surface-overlay origin-top mt-1 right-0 top-auto tbl-action-dropdown-menu text-left">
                            <li>
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer"
                                   (click)="openPreview(template)">
                                    <i class="pi pi-eye mr-2 text-primary"></i>
                                    <span>Preview as sent</span>
                                </a>
                            </li>
                            <li>
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer"
                                   (click)="openEditDialog(template)">
                                    <i class="pi pi-pencil mr-2 text-blue-500"></i>
                                    <span>Edit</span>
                                </a>
                            </li>
                            <li>
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer text-red-500"
                                   (click)="onDelete(template)">
                                    <i class="pi pi-trash mr-2"></i>
                                    <span>Delete</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-4">
                    <div class="text-500">No email templates found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-email-template-form-dialog
        [(visible)]="dialogVisible"
        [templateId]="editingId"
        (saved)="onDialogSaved()"
    ></app-email-template-form-dialog>

    <p-dialog
        header="Email preview (as sent)"
        [(visible)]="previewVisible"
        [modal]="true"
        appendTo="body"
        [style]="{ width: '44rem' }"
        [breakpoints]="{ '960px': '90vw' }"
        [draggable]="false"
        [resizable]="false"
    >
        <div class="email-preview-shell">
            <div class="email-preview-meta">
                <div class="text-500 text-sm mb-1">Subject</div>
                <div class="font-semibold mb-3">{{ previewSubject }}</div>
            </div>
            <div class="email-preview-frame" [innerHTML]="previewBodySafeHtml"></div>
        </div>
    </p-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
