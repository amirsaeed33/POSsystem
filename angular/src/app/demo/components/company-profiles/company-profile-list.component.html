<div class="card">
    <p-table
        #dt
        [value]="profiles"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="[
            'name',
            'taxNumber',
            'website',
            'invoiceContactPhone',
            'invoiceContactEmail'
        ]"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search company profiles"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-outlined w-full sm:w-auto flex-order-0 sm:flex-order-1"
                    (click)="openCreateDialog()"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name" class="white-space-nowrap">
                    Name <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="taxNumber" class="white-space-nowrap">
                    Tax Number <p-sortIcon field="taxNumber"></p-sortIcon>
                </th>
                <th pSortableColumn="website" class="white-space-nowrap">
                    Website <p-sortIcon field="website"></p-sortIcon>
                </th>
                <th pSortableColumn="invoiceContactPhone" class="white-space-nowrap">
                    Phone <p-sortIcon field="invoiceContactPhone"></p-sortIcon>
                </th>
                <th pSortableColumn="invoiceContactEmail" class="white-space-nowrap">
                    Email <p-sortIcon field="invoiceContactEmail"></p-sortIcon>
                </th>
                <th class="white-space-nowrap" style="width: 10rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-profile>
            <tr>
                <td>{{ profile.name }}</td>
                <td>{{ profile.taxNumber || '—' }}</td>
                <td>{{ profile.website || '—' }}</td>
                <td>{{ profile.invoiceContactPhone || '—' }}</td>
                <td>{{ profile.invoiceContactEmail || '—' }}</td>
                <td>
                    <div class="flex gap-2">
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-print"
                            class="p-button-text p-button-sm"
                            pTooltip="Preview receipt"
                            tooltipPosition="top"
                            (click)="openReceiptPreview(profile)"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-pencil"
                            class="p-button-text p-button-sm"
                            pTooltip="Edit"
                            tooltipPosition="top"
                            (click)="openEditDialog(profile)"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-trash"
                            class="p-button-text p-button-danger p-button-sm"
                            pTooltip="Delete"
                            tooltipPosition="top"
                            (click)="onDelete(profile)"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center p-4">
                    <div class="text-500">No company profiles found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-company-profile-form-dialog
        [(visible)]="dialogVisible"
        [profileId]="editingProfileId"
        (saved)="onDialogSaved()"
    ></app-company-profile-form-dialog>

    <app-company-profile-receipt-preview-dialog
        [(visible)]="receiptPreviewVisible"
        [profile]="previewProfile"
    ></app-company-profile-receipt-preview-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
