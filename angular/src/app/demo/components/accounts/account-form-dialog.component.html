<p-dialog
    [header]="dialogTitle"
    [visible]="visible"
    [modal]="true"
    appendTo="body"
    [blockScroll]="true"
    styleClass="dialog-sm"
    [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    (visibleChange)="onVisibleChange($event)"
>
    <div class="flex flex-column gap-3" *ngIf="!loading; else loadingTpl">
        <div class="flex flex-column gap-2">
            <label for="accountName" class="font-medium">
                Name <span class="p-error">*</span>
            </label>
            <input
                id="accountName"
                type="text"
                pInputText
                class="w-full"
                maxlength="128"
                [(ngModel)]="account.name"
                [disabled]="saving"
            />
        </div>

        <div class="flex flex-column gap-2">
            <label for="accountCode" class="font-medium">Code</label>
            <input
                id="accountCode"
                type="text"
                pInputText
                class="w-full"
                maxlength="64"
                [(ngModel)]="account.code"
                [disabled]="saving"
            />
        </div>

        <div class="flex flex-column gap-2">
            <label for="accountType" class="font-medium">Account Type</label>
            <p-dropdown
                inputId="accountType"
                [options]="accountTypeOptions"
                [(ngModel)]="account.accountType"
                optionLabel="label"
                optionValue="value"
                placeholder="Select account type"
                [showClear]="true"
                styleClass="w-full"
                appendTo="body"
                [disabled]="saving"
            ></p-dropdown>
        </div>

        <div class="flex flex-column gap-2">
            <label for="openingBalance" class="font-medium">Opening Balance</label>
            <p-inputNumber
                inputId="openingBalance"
                [(ngModel)]="account.openingBalance"
                mode="decimal"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                [showButtons]="false"
                styleClass="w-full"
                [disabled]="saving"
            ></p-inputNumber>
        </div>

        <div class="flex flex-column gap-2">
            <label for="accountDescription" class="font-medium">Description</label>
            <textarea
                id="accountDescription"
                pInputTextarea
                rows="3"
                class="w-full"
                maxlength="512"
                [(ngModel)]="account.description"
                [disabled]="saving"
            ></textarea>
        </div>

        <div class="flex align-items-center gap-2">
            <p-checkbox
                [(ngModel)]="account.isActive"
                [binary]="true"
                inputId="accountIsActive"
                [disabled]="saving"
            ></p-checkbox>
            <label for="accountIsActive" class="font-medium">Active</label>
        </div>
    </div>

    <ng-template #loadingTpl>
        <div class="flex align-items-center justify-content-center p-4">
            <i class="pi pi-spin pi-spinner text-2xl"></i>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            type="button"
            label="Cancel"
            class="p-button-text"
            (click)="onHide()"
            [disabled]="saving"
        ></button>
        <button
            pButton
            pRipple
            type="button"
            label="Save"
            icon="pi pi-check"
            (click)="save()"
            [disabled]="saving || loading || !(account.name || '').trim()"
            [loading]="saving"
        ></button>
    </ng-template>
</p-dialog>
