<p-dialog
    [header]="dialogTitle"
    [visible]="visible"
    [modal]="true"
    appendTo="body"
    [blockScroll]="true"
    styleClass="dialog-sm"
    [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    (visibleChange)="onVisibleChange($event)"
>
    <div class="flex flex-column gap-3" *ngIf="!loading; else loadingTpl">
        <div class="flex flex-column gap-2">
            <label for="brandName" class="font-medium">Name <span class="p-error">*</span></label>
            <input
                id="brandName"
                type="text"
                pInputText
                class="w-full"
                maxlength="128"
                [(ngModel)]="brand.name"
                [disabled]="saving"
            />
        </div>

        <div class="flex flex-column gap-2">
            <label for="brandDescription" class="font-medium">Description</label>
            <textarea
                id="brandDescription"
                pInputTextarea
                rows="3"
                class="w-full"
                maxlength="512"
                [(ngModel)]="brand.description"
                [disabled]="saving"
            ></textarea>
        </div>
    </div>

    <ng-template #loadingTpl>
        <div class="flex align-items-center justify-content-center p-4">
            <i class="pi pi-spin pi-spinner text-2xl"></i>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            type="button"
            label="Cancel"
            class="p-button-text"
            (click)="onHide()"
            [disabled]="saving"
        ></button>
        <button
            pButton
            pRipple
            type="button"
            label="Save"
            icon="pi pi-check"
            (click)="save()"
            [disabled]="saving || loading || !(brand.name || '').trim()"
            [loading]="saving"
        ></button>
    </ng-template>
</p-dialog>
