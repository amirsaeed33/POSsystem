<div [ngClass]="{ card: !embedded }">
    <p-table
        #dt
        [value]="brands"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['name', 'description']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search brands"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-primary w-full sm:w-auto flex-order-0 sm:flex-order-1 font-semibold"
                    (click)="openCreateDialog()"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name" class="white-space-nowrap">
                    Name <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="description" class="white-space-nowrap">
                    Description <p-sortIcon field="description"></p-sortIcon>
                </th>
                <th class="white-space-nowrap" style="width: 8rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-brand>
            <tr>
                <td>{{ brand.name }}</td>
                <td>{{ brand.description || '—' }}</td>
                <td>
                    <div class="flex gap-2">
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-pencil"
                            class="tbl-action-btn edit-btn"
                            pTooltip="Edit"
                            tooltipPosition="top"
                            (click)="openEditDialog(brand)"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-trash"
                            class="tbl-action-btn delete-btn"
                            pTooltip="Delete"
                            tooltipPosition="top"
                            (click)="onDelete(brand)"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="3" class="text-center p-4">
                    <div class="text-500">No brands found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-brand-form-dialog
        [(visible)]="dialogVisible"
        [brandId]="editingBrandId"
        (saved)="onDialogSaved()"
    ></app-brand-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
