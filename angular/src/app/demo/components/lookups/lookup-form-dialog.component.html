<p-dialog [header]="dialogTitle" [visible]="visible" [modal]="true" appendTo="body" [blockScroll]="true"
    [style]="{ width: '32rem' }" [breakpoints]="{ '960px': '95vw' }" [draggable]="false" [resizable]="false"
    (visibleChange)="onVisibleChange($event)">
    <div class="flex flex-column gap-3" *ngIf="!loading; else loadingTpl">
        <div class="flex flex-column gap-2">
            <label class="font-medium">Type <span class="p-error">*</span></label>
            <p-dropdown
                [options]="typeOptions"
                [(ngModel)]="type"
                optionLabel="label"
                optionValue="value"
                placeholder="Select type"
                appendTo="body"
                [filter]="true"
                filterBy="label"
                styleClass="w-full"
                [disabled]="saving || !!id"
            ></p-dropdown>
        </div>
        <div class="flex flex-column gap-2">
            <label class="font-medium">Name <span class="p-error">*</span></label>
            <input type="text" pInputText class="w-full" [(ngModel)]="name" [disabled]="saving" placeholder="e.g. Cash, Damage" />
            <small class="text-500">Stable code stored on records. Prefer no spaces.</small>
        </div>
        <div class="flex flex-column gap-2">
            <label class="font-medium">Display Name <span class="p-error">*</span></label>
            <input type="text" pInputText class="w-full" [(ngModel)]="displayName" [disabled]="saving" placeholder="e.g. Bank Transfer" />
        </div>
        <div class="flex flex-column gap-2">
            <label class="font-medium">Sort Order</label>
            <p-inputNumber [(ngModel)]="sortOrder" [disabled]="saving" styleClass="w-full"></p-inputNumber>
        </div>
        <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="isActive" [binary]="true" inputId="lookupActive" [disabled]="saving"></p-checkbox>
            <label for="lookupActive">Active</label>
        </div>
    </div>
    <ng-template #loadingTpl>
        <div class="flex align-items-center justify-content-center p-4"><i class="pi pi-spin pi-spinner text-2xl"></i></div>
    </ng-template>
    <ng-template pTemplate="footer">
        <button pButton pRipple type="button" label="Cancel" class="p-button-text" (click)="onHide()" [disabled]="saving"></button>
        <button pButton pRipple type="button" label="Save" icon="pi pi-check" (click)="save()" [disabled]="saving || loading" [loading]="saving"></button>
    </ng-template>
</p-dialog>
