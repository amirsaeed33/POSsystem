<div class="card">
    <div class="flex flex-wrap gap-3 align-items-end mb-3">
        <div class="flex flex-column gap-2">
            <label class="font-medium">Type</label>
            <p-dropdown [options]="typeOptions" [(ngModel)]="filterType" optionLabel="label" optionValue="value"
                placeholder="All types" [showClear]="true" [filter]="true" filterBy="label"
                (onChange)="onTypeFilterChange()" [style]="{ minWidth: '14rem' }"></p-dropdown>
        </div>
    </div>

    <p-table #dt [value]="items" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
        responsiveLayout="scroll" [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]" [globalFilterFields]="['type', 'name', 'displayName']">
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input pInputText type="text" class="w-full" placeholder="Search lookups"
                            [(ngModel)]="keyword" (keyup.enter)="onSearch()" (input)="onGlobalFilter(dt, $event)" />
                    </span>
                    <button pButton pRipple type="button" icon="pi pi-search" class="p-button-outlined"
                        label="Search" (click)="onSearch()"></button>
                </div>
                <button pButton pRipple type="button" icon="pi pi-plus" label="Create"
                    class="p-button-primary font-semibold w-full sm:w-auto flex-order-0 sm:flex-order-1"
                    (click)="openCreateDialog()"></button>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th>Type</th>
                <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="displayName">Display Name <p-sortIcon field="displayName"></p-sortIcon></th>
                <th>Sort</th>
                <th>Active</th>
                <th class="text-center" style="width: 4.5rem">Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ typeLabel(item.type) }}</td>
                <td><code>{{ item.name }}</code></td>
                <td>{{ item.displayName }}</td>
                <td>{{ item.sortOrder }}</td>
                <td>
                    <span class="status-pill" [class.status-pill-on]="item.isActive" [class.status-pill-off]="!item.isActive">
                        {{ item.isActive ? 'Yes' : 'No' }}
                    </span>
                </td>
                <td class="text-center">
                    <div class="relative flex align-items-center justify-content-center">
                        <button
                            type="button"
                            class="p-link w-2rem h-2rem border-circle inline-flex align-items-center justify-content-center hover:surface-hover transition-colors transition-duration-150"
                            pStyleClass="@next"
                            enterClass="hidden"
                            enterActiveClass="scalein"
                            leaveToClass="hidden"
                            leaveActiveClass="fadeout"
                            [hideOnOutsideClick]="true"
                            pTooltip="Actions"
                            tooltipPosition="left"
                        >
                            <i class="pi pi-ellipsis-v text-color"></i>
                        </button>
                        <ul class="list-none p-2 m-0 border-round shadow-3 hidden absolute surface-overlay origin-top mt-1 right-0 top-auto tbl-action-dropdown-menu text-left">
                            <li>
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer"
                                   (click)="openEditDialog(item)">
                                    <i class="pi pi-pencil mr-2 text-blue-500"></i>
                                    <span>Edit</span>
                                </a>
                            </li>
                            <li>
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer text-red-500"
                                   (click)="onDelete(item)">
                                    <i class="pi pi-trash mr-2"></i>
                                    <span>Delete</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr><td colspan="6" class="text-center p-4"><div class="text-500">No lookups found</div></td></tr>
        </ng-template>
    </p-table>
    <app-lookup-form-dialog [(visible)]="dialogVisible" [id]="editingId" [defaultType]="filterType" (saved)="onDialogSaved()"></app-lookup-form-dialog>
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
