<p-dialog
    header="Reset Password"
    [(visible)]="visible"
    (visibleChange)="onVisibleChange($event)"
    [modal]="true"
    [style]="{ width: '32rem' }"
    [breakpoints]="{ '960px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onHide()"
>
    <p class="text-color-secondary mt-0 mb-3" *ngIf="userName">
        Reset password for <strong>{{ userName }}</strong>
    </p>

    <p class="text-primary mb-3">
        Enter your admin password to authorize this reset.
    </p>

    <div class="field mb-4">
        <label for="adminPassword" class="block mb-2">Admin Password</label>
        <input
            pInputText
            id="adminPassword"
            type="password"
            class="w-full"
            [(ngModel)]="adminPassword"
            autocomplete="current-password"
        />
    </div>

    <p class="text-primary mb-3">
        Copy this temporary password and share it with the user.
    </p>

    <div class="field mb-2">
        <label for="newPassword" class="block mb-2">New Password</label>
        <input
            pInputText
            id="newPassword"
            type="text"
            class="w-full"
            [ngModel]="newPassword"
            readonly
        />
    </div>

    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            type="button"
            label="Cancel"
            class="p-button-text"
            [disabled]="saving"
            (click)="onHide()"
        ></button>
        <button
            pButton
            pRipple
            type="button"
            label="Reset"
            icon="pi pi-check"
            [loading]="saving"
            [disabled]="!canSave"
            (click)="save()"
        ></button>
    </ng-template>
</p-dialog>
