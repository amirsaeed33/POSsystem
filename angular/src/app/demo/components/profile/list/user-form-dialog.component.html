<p-dialog
    [header]="dialogTitle"
    [visible]="visible"
    [modal]="true"
    appendTo="body"
    [blockScroll]="true"
    [style]="{ width: '56rem' }"
    [breakpoints]="{ '960px': '85vw', '640px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    [contentStyle]="{ 'max-height': '70vh', overflow: 'auto' }"
    (visibleChange)="onVisibleChange($event)"
>
    <div *ngIf="loading" class="flex align-items-center justify-content-center p-5">
        <i class="pi pi-spin pi-spinner text-2xl"></i>
    </div>

    <ng-container *ngIf="!loading">
        <div class="flex justify-content-center align-items-center mb-4">
            <div
                class="profile-picture-container"
                (click)="onProfilePictureClick()"
                style="cursor: pointer; position: relative; display: inline-block;"
            >
                <img
                    [src]="profilePictureUrl || 'assets/layout/images/avatar.png'"
                    alt="Profile Picture"
                    class="border-circle"
                    style="width: 110px; height: 110px; object-fit: cover; border: 3px solid var(--primary-color); display: block;"
                    (error)="onImageError($event)"
                />
                <div
                    class="profile-picture-overlay"
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background-color: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;"
                >
                    <i class="pi pi-camera" style="font-size: 1.5rem; color: white;"></i>
                    <span style="color: white; font-weight: 500; margin-top: 0.25rem; font-size: 0.75rem;">Change Photo</span>
                </div>
                <input
                    #fileInput
                    type="file"
                    accept="image/*"
                    (change)="onFileSelect($event)"
                    style="display: none;"
                />
            </div>
        </div>
        <style>
            .profile-picture-container:hover .profile-picture-overlay {
                opacity: 1 !important;
            }
        </style>
        <div class="flex justify-content-center mb-3">
            <small class="text-500 text-center">Max 5MB. JPEG, PNG, GIF, or WebP</small>
        </div>

        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
            <div class="grid formgrid p-fluid">
                <div class="field mb-3 col-12 md:col-6">
                    <label for="dlgUserName" class="font-medium text-900">
                        Username <span class="text-red-500">*</span>
                    </label>
                    <input
                        id="dlgUserName"
                        type="text"
                        pInputText
                        formControlName="userName"
                        [disabled]="saving"
                    />
                    <small
                        class="p-error"
                        *ngIf="userForm.get('userName')?.invalid && userForm.get('userName')?.touched"
                    >
                        Username is required
                    </small>
                </div>

                <div class="field mb-3 col-12 md:col-6">
                    <label for="dlgEmail" class="font-medium text-900">
                        Email <span class="text-red-500">*</span>
                    </label>
                    <input
                        id="dlgEmail"
                        type="email"
                        pInputText
                        formControlName="emailAddress"
                        [disabled]="saving"
                    />
                    <small
                        class="p-error"
                        *ngIf="userForm.get('emailAddress')?.invalid && userForm.get('emailAddress')?.touched"
                    >
                        <span *ngIf="userForm.get('emailAddress')?.errors?.['required']">Email is required</span>
                        <span *ngIf="userForm.get('emailAddress')?.errors?.['email']">Invalid email format</span>
                    </small>
                </div>

                <div class="field mb-3 col-12 md:col-6">
                    <label for="dlgName" class="font-medium text-900">
                        First Name <span class="text-red-500">*</span>
                    </label>
                    <input id="dlgName" type="text" pInputText formControlName="name" [disabled]="saving" />
                    <small
                        class="p-error"
                        *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched"
                    >
                        First name is required
                    </small>
                </div>

                <div class="field mb-3 col-12 md:col-6">
                    <label for="dlgSurname" class="font-medium text-900">
                        Last Name <span class="text-red-500">*</span>
                    </label>
                    <input id="dlgSurname" type="text" pInputText formControlName="surname" [disabled]="saving" />
                    <small
                        class="p-error"
                        *ngIf="userForm.get('surname')?.invalid && userForm.get('surname')?.touched"
                    >
                        Last name is required
                    </small>
                </div>

                <div class="field mb-3 col-12 md:col-6">
                    <label for="dlgPassword" class="font-medium text-900">
                        Password
                        <span *ngIf="!isEdit" class="text-red-500">*</span>
                        <span *ngIf="isEdit" class="text-500 text-sm">(Leave blank to keep current)</span>
                    </label>
                    <input
                        id="dlgPassword"
                        type="password"
                        pInputText
                        formControlName="password"
                        [disabled]="saving"
                    />
                    <small
                        class="p-error"
                        *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched"
                    >
                        <span *ngIf="userForm.get('password')?.errors?.['required']">Password is required</span>
                        <span *ngIf="userForm.get('password')?.errors?.['minlength']">
                            Password must be at least 6 characters
                        </span>
                    </small>
                </div>

                <div class="field mb-3 col-12 md:col-6">
                    <label for="dlgRoles" class="font-medium text-900">Roles</label>
                    <p-multiSelect
                        inputId="dlgRoles"
                        [options]="roles"
                        optionLabel="displayName"
                        optionValue="name"
                        [(ngModel)]="selectedRoles"
                        [ngModelOptions]="{ standalone: true }"
                        placeholder="Select Roles"
                        [filter]="true"
                        [showClear]="true"
                        [disabled]="saving"
                    ></p-multiSelect>
                </div>

                <div class="field mb-3 col-12">
                    <p-checkbox
                        formControlName="isActive"
                        inputId="dlgIsActive"
                        [binary]="true"
                        [disabled]="saving"
                    ></p-checkbox>
                    <label for="dlgIsActive" class="ml-2">Active</label>
                </div>

                <div class="field mb-2 col-12">
                    <label class="font-medium text-900 mb-2 block">User Permissions</label>
                    <div *ngIf="loadingPermissions" class="flex align-items-center justify-content-center p-3">
                        <i class="pi pi-spin pi-spinner mr-2"></i>
                        <span>Loading permissions...</span>
                    </div>
                    <div
                        *ngIf="!loadingPermissions && getPermissionGroups().length === 0"
                        class="p-3 text-center text-500"
                    >
                        No permissions available
                    </div>
                    <div *ngIf="!loadingPermissions && getPermissionGroups().length > 0" class="grid">
                        <div
                            class="col-12 md:col-6 lg:col-4"
                            *ngFor="let groupName of getPermissionGroups()"
                        >
                            <div class="surface-ground border-round p-3 mb-2">
                                <h5 class="text-900 font-semibold mb-2 mt-0">{{ groupName }}</h5>
                                <div class="flex flex-column gap-2">
                                    <div
                                        *ngFor="let permission of permissionGroups[groupName]"
                                        class="flex align-items-center"
                                    >
                                        <p-checkbox
                                            [inputId]="'dlg-user-' + permission.name"
                                            [value]="permission.name"
                                            [(ngModel)]="selectedUserPermissions"
                                            [ngModelOptions]="{ standalone: true }"
                                            [disabled]="saving"
                                        ></p-checkbox>
                                        <label
                                            [for]="'dlg-user-' + permission.name"
                                            class="ml-2 cursor-pointer"
                                        >
                                            {{ permission.displayName }}
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </ng-container>

    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            type="button"
            label="Cancel"
            class="p-button-text"
            (click)="onHide()"
            [disabled]="saving"
        ></button>
        <button
            pButton
            pRipple
            type="button"
            [label]="isEdit ? 'Update' : 'Save'"
            icon="pi pi-check"
            (click)="onSubmit()"
            [disabled]="saving || loading || userForm.invalid"
            [loading]="saving"
        ></button>
    </ng-template>
</p-dialog>
