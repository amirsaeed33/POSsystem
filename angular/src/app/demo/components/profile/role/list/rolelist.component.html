<div class="card">
    <p-table #dt [value]="roles" [paginator]="true" [rows]="10" [showCurrentPageReport]="true" 
        responsiveLayout="scroll" [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" 
        [rowsPerPageOptions]="[10,25,50]"
        [globalFilterFields]="['name','displayName','description']">
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <span class="p-input-icon-left w-full sm:w-20rem flex-order-1 sm:flex-order-0">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Global Search" class="w-full" />
                </span>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-primary w-full sm:w-auto flex-order-0 sm:flex-order-1 font-semibold"
                    (click)="openCreateDialog()"
                ></button>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name" class="white-space-nowrap">Name <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="displayName" class="white-space-nowrap">Display Name <p-sortIcon field="displayName"></p-sortIcon></th>
                <th class="white-space-nowrap">Description</th>
                <th class="white-space-nowrap">Permissions</th>
                <th class="text-center" style="width: 4.5rem">Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-role>
            <tr>
                <td>{{role.name}}</td>
                <td>{{role.displayName}}</td>
                <td>{{role.description || '-'}}</td>
                <td>
                    <span *ngIf="role.grantedPermissions && role.grantedPermissions.length > 0" class="p-tag">
                        {{role.grantedPermissions.length}} permission(s)
                    </span>
                    <span *ngIf="!role.grantedPermissions || role.grantedPermissions.length === 0" class="text-500">No permissions</span>
                </td>
                <td class="text-center">
                    <div class="relative flex align-items-center justify-content-center">
                        <button
                            type="button"
                            class="p-link w-2rem h-2rem border-circle inline-flex align-items-center justify-content-center hover:surface-hover transition-colors transition-duration-150"
                            pStyleClass="@next"
                            enterClass="hidden"
                            enterActiveClass="scalein"
                            leaveToClass="hidden"
                            leaveActiveClass="fadeout"
                            [hideOnOutsideClick]="true"
                            pTooltip="Actions"
                            tooltipPosition="left"
                        >
                            <i class="pi pi-ellipsis-v text-color"></i>
                        </button>
                        <ul class="list-none p-2 m-0 border-round shadow-3 hidden absolute surface-overlay origin-top mt-1 right-0 top-auto tbl-action-dropdown-menu text-left">
                            <li>
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer"
                                   (click)="openEditDialog(role)">
                                    <i class="pi pi-pencil mr-2 text-blue-500"></i>
                                    <span>Edit</span>
                                </a>
                            </li>
                            <li>
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer text-red-500"
                                   (click)="onDeleteRole(role)">
                                    <i class="pi pi-trash mr-2"></i>
                                    <span>Delete</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-4">
                    <div class="text-500">No roles found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-role-form-dialog
        [(visible)]="dialogVisible"
        [roleId]="editingRoleId"
        (saved)="onDialogSaved()"
    ></app-role-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
