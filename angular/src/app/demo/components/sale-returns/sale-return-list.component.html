<div class="card">
    <p-table
        #dt
        [value]="returns"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['saleInvoiceNo', 'customerName', 'notes']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search sale returns"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-outlined w-full sm:w-auto flex-order-0 sm:flex-order-1"
                    (click)="openCreateDialog()"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="id">Return # <p-sortIcon field="id"></p-sortIcon></th>
                <th pSortableColumn="returnDate">Return Date <p-sortIcon field="returnDate"></p-sortIcon></th>
                <th pSortableColumn="saleInvoiceNo">Sale Invoice <p-sortIcon field="saleInvoiceNo"></p-sortIcon></th>
                <th pSortableColumn="customerName">Customer <p-sortIcon field="customerName"></p-sortIcon></th>
                <th pSortableColumn="totalAmount">Total <p-sortIcon field="totalAmount"></p-sortIcon></th>
                <th>Notes</th>
                <th style="width: 9rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr>
                <td>#{{ item.id }}</td>
                <td>{{ item.returnDate | date: 'mediumDate' }}</td>
                <td>{{ item.saleInvoiceNo || ('Sale #' + item.saleId) }}</td>
                <td>{{ item.customerName || '—' }}</td>
                <td>{{ item.totalAmount | number: '1.2-2' }}</td>
                <td>{{ item.notes || '—' }}</td>
                <td>
                    <div class="flex gap-2">
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-eye"
                            class="p-button-text p-button-sm"
                            pTooltip="View"
                            tooltipPosition="top"
                            (click)="openViewDialog(item)"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-trash"
                            class="p-button-text p-button-danger p-button-sm"
                            pTooltip="Delete"
                            tooltipPosition="top"
                            (click)="onDelete(item)"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7" class="text-center p-4">
                    <div class="text-500">No sale returns found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-sale-return-form-dialog
        [(visible)]="createDialogVisible"
        [saleId]="createSaleId"
        (saved)="onDialogSaved()"
    ></app-sale-return-form-dialog>

    <app-sale-return-view-dialog
        [(visible)]="viewDialogVisible"
        [saleReturnId]="viewingReturnId"
        (deleted)="onDialogSaved()"
    ></app-sale-return-view-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
