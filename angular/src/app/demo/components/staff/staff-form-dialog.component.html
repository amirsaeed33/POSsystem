<p-dialog
    [header]="dialogTitle"
    [visible]="visible"
    [modal]="true"
    appendTo="body"
    [blockScroll]="true"
    styleClass="dialog-sm"
    [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    (visibleChange)="onVisibleChange($event)"
>
    <div class="flex flex-column gap-3" *ngIf="!loading; else loadingTpl">
        <div class="flex flex-column gap-2">
            <label for="staffName" class="font-medium">Full Name <span class="p-error">*</span></label>
            <input
                id="staffName"
                type="text"
                pInputText
                class="w-full"
                maxlength="128"
                [(ngModel)]="staff.name"
                [disabled]="saving"
            />
        </div>

        <div class="grid">
            <div class="col-12 md:col-6 flex flex-column gap-2">
                <label for="staffEmployeeCode" class="font-medium">Employee Code</label>
                <input
                    id="staffEmployeeCode"
                    type="text"
                    pInputText
                    class="w-full"
                    maxlength="64"
                    [(ngModel)]="staff.employeeCode"
                    [disabled]="saving"
                />
            </div>
            <div class="col-12 md:col-6 flex flex-column gap-2">
                <label for="staffDesignation" class="font-medium">Designation</label>
                <input
                    id="staffDesignation"
                    type="text"
                    pInputText
                    class="w-full"
                    maxlength="128"
                    [(ngModel)]="staff.designation"
                    [disabled]="saving"
                />
            </div>
        </div>

        <div class="grid">
            <div class="col-12 md:col-6 flex flex-column gap-2">
                <label for="staffPhone" class="font-medium">Phone</label>
                <input
                    id="staffPhone"
                    type="text"
                    pInputText
                    class="w-full"
                    maxlength="32"
                    [(ngModel)]="staff.phone"
                    [disabled]="saving"
                />
            </div>
            <div class="col-12 md:col-6 flex flex-column gap-2">
                <label for="staffEmail" class="font-medium">Email</label>
                <input
                    id="staffEmail"
                    type="email"
                    pInputText
                    class="w-full"
                    maxlength="256"
                    [(ngModel)]="staff.email"
                    [disabled]="saving"
                />
            </div>
        </div>

        <div class="flex flex-column gap-2">
            <label for="staffAddress" class="font-medium">Address</label>
            <textarea
                id="staffAddress"
                pInputTextarea
                rows="2"
                class="w-full"
                maxlength="512"
                [(ngModel)]="staff.address"
                [disabled]="saving"
            ></textarea>
        </div>

        <div class="grid">
            <div class="col-12 md:col-6 flex flex-column gap-2">
                <label for="staffJoiningDate" class="font-medium">
                    Joining Date <span class="p-error">*</span>
                </label>
                <input
                    id="staffJoiningDate"
                    type="date"
                    pInputText
                    class="w-full"
                    [(ngModel)]="staff.joiningDate"
                    [disabled]="saving"
                />
            </div>
            <div class="col-12 md:col-6 flex flex-column gap-2">
                <label for="staffBasicSalary" class="font-medium">Basic Salary</label>
                <p-inputNumber
                    inputId="staffBasicSalary"
                    [(ngModel)]="staff.basicSalary"
                    mode="decimal"
                    [minFractionDigits]="0"
                    [maxFractionDigits]="2"
                    styleClass="w-full"
                    inputStyleClass="w-full"
                    [disabled]="saving"
                ></p-inputNumber>
            </div>
        </div>

        <div class="flex flex-column gap-2">
            <label for="staffBranch" class="font-medium">Branch</label>
            <p-dropdown
                inputId="staffBranch"
                [options]="branches"
                [(ngModel)]="staff.branchId"
                optionLabel="name"
                optionValue="id"
                placeholder="Select branch"
                [showClear]="false"
                styleClass="w-full"
                [disabled]="true"
            ></p-dropdown>
        </div>

        <div class="flex align-items-center gap-2">
            <p-checkbox
                [binary]="true"
                [(ngModel)]="staff.isActive"
                inputId="staffIsActive"
                [disabled]="saving"
            ></p-checkbox>
            <label for="staffIsActive">Active</label>
        </div>
    </div>

    <ng-template #loadingTpl>
        <div class="flex align-items-center justify-content-center p-4">
            <i class="pi pi-spin pi-spinner text-2xl"></i>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            type="button"
            label="Cancel"
            class="p-button-text"
            (click)="onHide()"
            [disabled]="saving"
        ></button>
        <button
            pButton
            pRipple
            type="button"
            label="Save"
            icon="pi pi-check"
            (click)="save()"
            [disabled]="saving || loading || !(staff.name || '').trim() || !staff.joiningDate"
            [loading]="saving"
        ></button>
    </ng-template>
</p-dialog>
