<div [ngClass]="{ card: !embedded }">
    <p-table
        #dt
        [value]="categories"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['name', 'description', 'departmentName']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search categories"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-primary w-full sm:w-auto flex-order-0 sm:flex-order-1 font-semibold"
                    (click)="openCreateDialog()"
                    [disabled]="!canCreate"
                    [pTooltip]="!canCreate ? 'You do not have permission to Create' : ''"
                    tooltipPosition="top"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th style="width: 3.5rem"></th>
                <th pSortableColumn="name" class="white-space-nowrap">
                    Name <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="departmentName" class="white-space-nowrap">
                    Department <p-sortIcon field="departmentName"></p-sortIcon>
                </th>
                <th class="white-space-nowrap">Default Unit</th>
                <th pSortableColumn="description" class="white-space-nowrap">
                    Description <p-sortIcon field="description"></p-sortIcon>
                </th>
                <th class="text-center" style="width: 4.5rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-category>
            <tr>
                <td>
                    <img
                        *ngIf="getImageUrl(category) as img"
                        [src]="img"
                        alt=""
                        class="border-circle"
                        style="width: 2.25rem; height: 2.25rem; object-fit: cover;"
                    />
                    <span
                        *ngIf="!getImageUrl(category)"
                        class="inline-flex align-items-center justify-content-center border-circle surface-100 text-500"
                        style="width: 2.25rem; height: 2.25rem;"
                    >
                        <i class="pi pi-image text-sm"></i>
                    </span>
                </td>
                <td>
                    <a
                        *ngIf="canEdit; else categoryNamePlain"
                        href="javascript:void(0)"
                        class="font-semibold text-primary cursor-pointer hover:underline"
                        (click)="openEditDialog(category); $event.preventDefault()"
                        pTooltip="Edit category"
                        tooltipPosition="top"
                    >{{ category.name }}</a>
                    <ng-template #categoryNamePlain>{{ category.name }}</ng-template>
                </td>
                <td>
                    <span *ngIf="category.departmentName" class="p-tag p-tag-warning">{{ category.departmentName }}</span>
                    <span *ngIf="!category.departmentName" class="text-400">—</span>
                </td>
                <td>
                    <span *ngIf="category.defaultUnitName" class="p-tag p-tag-info">{{ category.defaultUnitName }}</span>
                    <span *ngIf="!category.defaultUnitName" class="text-400">—</span>
                </td>
                <td>{{ category.description || '—' }}</td>
                <td class="text-center">
                    <app-row-actions
                        [items]="getRowActions(category)"
                    ></app-row-actions>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-4">
                    <div class="text-500">No categories found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-category-form-dialog
        [(visible)]="dialogVisible"
        [categoryId]="editingCategoryId"
        (saved)="onDialogSaved()"
    ></app-category-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
