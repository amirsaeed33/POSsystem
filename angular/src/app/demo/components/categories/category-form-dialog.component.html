<p-dialog
    [header]="dialogTitle"
    [visible]="visible"
    [modal]="true"
    appendTo="body"
    [blockScroll]="true"
    styleClass="dialog-sm"
    [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    (visibleChange)="onVisibleChange($event)"
>
    <div class="flex flex-column gap-3" *ngIf="!loading; else loadingTpl">
        <!-- Category image upload -->
        <div class="flex justify-content-center align-items-center mb-1">
            <div
                class="category-avatar-container"
                (click)="!saving && fileInput.click()"
                style="cursor: pointer; position: relative; display: inline-block;"
                pTooltip="Click to upload category picture"
                tooltipPosition="bottom"
            >
                <img
                    *ngIf="imagePreview; else noImageTpl"
                    [src]="imagePreview"
                    alt="Category image"
                    class="border-circle shadow-2"
                    style="width: 110px; height: 110px; object-fit: cover; border: 3px solid var(--primary-color); display: block;"
                />
                <ng-template #noImageTpl>
                    <div
                        class="border-circle surface-100 flex flex-column align-items-center justify-content-center shadow-1 text-500 hover:surface-200 transition-colors"
                        style="width: 110px; height: 110px; border: 3px dashed var(--primary-color);"
                    >
                        <i class="pi pi-camera text-3xl text-primary mb-1"></i>
                        <span class="text-xs font-semibold text-600">Upload</span>
                    </div>
                </ng-template>

                <div
                    *ngIf="imagePreview"
                    class="category-avatar-overlay"
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background-color: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;"
                >
                    <i class="pi pi-camera" style="font-size: 1.5rem; color: white;"></i>
                    <span style="color: white; font-weight: 500; margin-top: 0.25rem; font-size: 0.75rem;">Change</span>
                </div>
                <input
                    #fileInput
                    type="file"
                    accept="image/*"
                    (change)="onFileSelected($event)"
                    style="display: none;"
                    [disabled]="saving"
                />
            </div>
        </div>
        <div class="flex justify-content-center gap-2" *ngIf="imagePreview">
            <button
                pButton
                pRipple
                type="button"
                label="Remove picture"
                icon="pi pi-trash"
                class="p-button-text p-button-danger p-button-sm"
                [disabled]="saving"
                (click)="clearImage()"
            ></button>
        </div>
        <style>
            .category-avatar-container:hover .category-avatar-overlay {
                opacity: 1 !important;
            }
        </style>

        <div class="flex flex-column gap-2">
            <label for="categoryName" class="font-medium">Name <span class="p-error">*</span></label>
            <input
                id="categoryName"
                type="text"
                pInputText
                class="w-full"
                minlength="2"
                maxlength="128"
                [(ngModel)]="category.name"
                [disabled]="saving"
                (keyup.enter)="save()"
            />
            <small class="text-500">At least 2 characters, including one letter (not symbols only).</small>
        </div>

        <div class="flex flex-column gap-2">
            <label for="categoryDepartment" class="font-medium">Department (Optional)</label>
            <p-dropdown
                id="categoryDepartment"
                [options]="departments"
                [(ngModel)]="category.departmentId"
                optionLabel="name"
                optionValue="id"
                [showClear]="true"
                [filter]="true"
                filterBy="name"
                placeholder="Select Department"
                styleClass="w-full"
                appendTo="body"
                [disabled]="saving"
            ></p-dropdown>
        </div>

        <div class="flex flex-column gap-2">
            <label for="defaultUnit" class="font-medium">Default Unit (Optional UI Hint)</label>
            <p-dropdown
                id="defaultUnit"
                [options]="units"
                [(ngModel)]="category.defaultUnitId"
                optionLabel="name"
                optionValue="id"
                [showClear]="true"
                [filter]="true"
                filterBy="name,symbol"
                placeholder="Select Default Unit"
                styleClass="w-full"
                appendTo="body"
                [disabled]="saving"
            ></p-dropdown>
        </div>

        <div class="flex flex-column gap-2" *ngIf="categoryId">
            <label for="categoryDescription" class="font-medium">Description</label>
            <textarea
                id="categoryDescription"
                pInputTextarea
                rows="3"
                class="w-full"
                maxlength="512"
                [(ngModel)]="category.description"
                [disabled]="saving"
                (keydown.control.enter)="save()"
            ></textarea>
        </div>
    </div>

    <ng-template #loadingTpl>
        <div class="flex align-items-center justify-content-center p-4">
            <i class="pi pi-spin pi-spinner text-2xl"></i>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            type="button"
            label="Cancel"
            class="p-button-text"
            (click)="onHide()"
            [disabled]="saving"
        ></button>
        <button
            pButton
            pRipple
            type="button"
            label="Save"
            icon="pi pi-check"
            (click)="save()"
            [disabled]="saving || loading || !canSave"
            [loading]="saving"
        ></button>
    </ng-template>
</p-dialog>
