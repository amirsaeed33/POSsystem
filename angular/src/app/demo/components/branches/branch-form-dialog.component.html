<p-dialog
    [header]="dialogTitle"
    [visible]="visible"
    [modal]="true"
    appendTo="body"
    [blockScroll]="true"
    [style]="{ width: '32rem' }"
    [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    (visibleChange)="onVisibleChange($event)"
>
    <div class="flex flex-column gap-3" *ngIf="!loading; else loadingTpl">
        <div class="flex flex-column gap-2">
            <label for="branchName" class="font-medium">Name <span class="p-error">*</span></label>
            <input
                id="branchName"
                type="text"
                pInputText
                class="w-full"
                maxlength="128"
                [(ngModel)]="branch.name"
                [disabled]="saving"
            />
        </div>

        <div class="flex flex-column gap-2">
            <label for="branchCode" class="font-medium">Code <span class="p-error">*</span></label>
            <input
                id="branchCode"
                type="text"
                pInputText
                class="w-full"
                maxlength="32"
                [(ngModel)]="branch.code"
                [disabled]="saving || branch.isDefault"
            />
        </div>

        <div class="flex align-items-center gap-2">
            <p-inputSwitch
                [(ngModel)]="branch.isActive"
                [disabled]="saving || (branch.isDefault && branch.isActive)"
                inputId="branchActive"
            ></p-inputSwitch>
            <label for="branchActive" class="font-medium">Active</label>
        </div>
    </div>

    <ng-template #loadingTpl>
        <div class="flex align-items-center justify-content-center p-4">
            <i class="pi pi-spin pi-spinner text-2xl"></i>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            type="button"
            label="Cancel"
            class="p-button-text"
            (click)="onHide()"
            [disabled]="saving"
        ></button>
        <button
            pButton
            pRipple
            type="button"
            label="Save"
            icon="pi pi-check"
            (click)="save()"
            [disabled]="saving || loading || !(branch.name || '').trim() || !(branch.code || '').trim()"
            [loading]="saving"
        ></button>
    </ng-template>
</p-dialog>
