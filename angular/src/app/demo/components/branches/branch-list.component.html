<div class="card">
    <p-table
        #dt
        [value]="branches"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['name', 'code']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search branches"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Create"
                    class="p-button-outlined w-full sm:w-auto flex-order-0 sm:flex-order-1"
                    (click)="openCreateDialog()"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name" class="white-space-nowrap">
                    Name <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="code" class="white-space-nowrap">
                    Code <p-sortIcon field="code"></p-sortIcon>
                </th>
                <th class="white-space-nowrap">Status</th>
                <th class="white-space-nowrap">Default</th>
                <th class="white-space-nowrap" style="width: 8rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-branch>
            <tr>
                <td>{{ branch.name }}</td>
                <td>{{ branch.code }}</td>
                <td>
                    <span [class]="branch.isActive ? 'text-green-600' : 'text-500'">
                        {{ branch.isActive ? 'Active' : 'Inactive' }}
                    </span>
                </td>
                <td>{{ branch.isDefault ? 'Yes' : 'No' }}</td>
                <td>
                    <div class="flex gap-2">
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-pencil"
                            class="p-button-text p-button-sm"
                            pTooltip="Edit"
                            tooltipPosition="top"
                            (click)="openEditDialog(branch)"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-trash"
                            class="p-button-text p-button-danger p-button-sm"
                            pTooltip="Delete"
                            tooltipPosition="top"
                            [disabled]="branch.isDefault"
                            (click)="onDelete(branch)"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-4">
                    <div class="text-500">No branches found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-branch-form-dialog
        [(visible)]="dialogVisible"
        [branchId]="editingBranchId"
        (saved)="onDialogSaved()"
    ></app-branch-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
