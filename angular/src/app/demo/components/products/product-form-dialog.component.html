<p-dialog
    [header]="dialogTitle"
    [visible]="visible"
    [modal]="true"
    appendTo="body"
    [blockScroll]="true"
    styleClass="dialog-md"
    [breakpoints]="{ '960px': '85vw', '640px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    (visibleChange)="onVisibleChange($event)"
>
    <div class="flex flex-column gap-3" *ngIf="!loading; else loadingTpl">
        <!-- Circular Product Image at Top -->
        <div class="flex justify-content-center align-items-center mb-1">
            <div
                class="product-avatar-container"
                (click)="fileInput.click()"
                style="cursor: pointer; position: relative; display: inline-block;"
                pTooltip="Click to change product image"
                tooltipPosition="bottom"
            >
                <img
                    *ngIf="imagePreview; else noImageTpl"
                    [src]="imagePreview"
                    alt="Product Image"
                    class="border-circle shadow-2"
                    style="width: 110px; height: 110px; object-fit: cover; border: 3px solid var(--primary-color); display: block;"
                />
                <ng-template #noImageTpl>
                    <div
                        class="border-circle surface-100 flex flex-column align-items-center justify-content-center shadow-1 text-500 hover:surface-200 transition-colors"
                        style="width: 110px; height: 110px; border: 3px dashed var(--primary-color);"
                    >
                        <i class="pi pi-camera text-3xl text-primary mb-1"></i>
                        <span class="text-xs font-semibold text-600">Upload</span>
                    </div>
                </ng-template>

                <div
                    *ngIf="imagePreview"
                    class="product-avatar-overlay"
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background-color: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;"
                >
                    <i class="pi pi-camera" style="font-size: 1.5rem; color: white;"></i>
                    <span style="color: white; font-weight: 500; margin-top: 0.25rem; font-size: 0.75rem;">Change</span>
                </div>
                <input
                    #fileInput
                    type="file"
                    accept="image/*"
                    (change)="onFileSelected($event)"
                    style="display: none;"
                    [disabled]="saving"
                />
            </div>
        </div>
        <style>
            .product-avatar-container:hover .product-avatar-overlay {
                opacity: 1 !important;
            }
        </style>

        <div class="formgrid grid">
            <div class="field col-12 md:col-6 flex flex-column gap-2 mb-0">
                <label for="productName" class="font-medium">Name <span class="p-error">*</span></label>
                <input id="productName" type="text" pInputText class="w-full" maxlength="256"
                    [(ngModel)]="product.name" [disabled]="saving" />
            </div>
            <div class="field col-12 md:col-6 flex flex-column gap-2 mb-0">
                <label for="productLocation" class="font-medium">Location</label>
                <input id="productLocation" type="text" pInputText class="w-full" maxlength="256"
                    [(ngModel)]="product.location" [disabled]="saving" />
            </div>
        </div>

        <div class="flex flex-column gap-2" *ngIf="productId">
            <label for="productDescription" class="font-medium">Description</label>
            <textarea id="productDescription" pInputTextarea rows="2" class="w-full" maxlength="1024"
                [(ngModel)]="product.description" [disabled]="saving"></textarea>
        </div>

        <div class="flex flex-column gap-2">
            <label for="productBarcode" class="font-medium">Barcode <span class="p-error">*</span></label>
            <input id="productBarcode" type="text" pInputText class="w-full" maxlength="64"
                [(ngModel)]="product.barcode" [disabled]="saving" />
        </div>



        <div class="formgrid grid">
            <div class="field col-12 md:col-4 flex flex-column gap-2">
                <label for="productCost" class="font-medium">Purchase Price <span class="p-error">*</span></label>
                <p-inputNumber inputId="productCost" [(ngModel)]="product.costPrice" mode="decimal"
                    [minFractionDigits]="2" [min]="0" styleClass="w-full" inputStyleClass="w-full"
                    [disabled]="saving"></p-inputNumber>
            </div>
            <div class="field col-12 md:col-4 flex flex-column gap-2">
                <label for="productWholesale" class="font-medium">Wholesale Price <span class="p-error">*</span></label>
                <p-inputNumber inputId="productWholesale" [(ngModel)]="product.wholesalePrice" mode="decimal"
                    [minFractionDigits]="2" [min]="0" styleClass="w-full" inputStyleClass="w-full"
                    [disabled]="saving"></p-inputNumber>
            </div>
            <div class="field col-12 md:col-4 flex flex-column gap-2">
                <label for="productPrice" class="font-medium">Selling Price <span class="p-error">*</span></label>
                <p-inputNumber inputId="productPrice" [(ngModel)]="product.price" mode="decimal"
                    [minFractionDigits]="2" [min]="0" styleClass="w-full" inputStyleClass="w-full"
                    [disabled]="saving"></p-inputNumber>
            </div>
        </div>

        <small class="text-color-secondary" *ngIf="productId">
            Profit/unit: {{ profitPerUnit | number: '1.2-2' }}
            <span *ngIf="profitMarginPercent !== null">
                ({{ profitMarginPercent | number: '1.1-1' }}%)
            </span>
        </small>

        <div class="flex flex-column gap-2" *ngIf="productId">
            <label for="alertLimit" class="font-medium">Alert Quantity Limit <span class="p-error">*</span></label>
            <p-inputNumber inputId="alertLimit" [(ngModel)]="product.alertQuantityLimit"
                [min]="0" [useGrouping]="false" styleClass="w-full" inputStyleClass="w-full"
                [disabled]="saving"></p-inputNumber>
        </div>

        <div class="formgrid grid">
            <div class="field col-12 md:col-4 flex flex-column gap-2">
                <label for="categoryId" class="font-medium">Category <span class="p-error">*</span></label>
                <p-dropdown inputId="categoryId" [options]="categories" [(ngModel)]="product.categoryId" (onChange)="onCategoryChange($event.value)"
                    optionLabel="name" optionValue="id" placeholder="Select category"
                    [filter]="true" styleClass="w-full" [disabled]="saving" appendTo="body"></p-dropdown>
            </div>
            <div class="field col-12 md:col-4 flex flex-column gap-2">
                <label for="brandId" class="font-medium">Brand <span class="p-error">*</span></label>
                <p-dropdown inputId="brandId" [options]="brands" [(ngModel)]="product.brandId"
                    optionLabel="name" optionValue="id" placeholder="Select brand"
                    [filter]="true" styleClass="w-full" [disabled]="saving" appendTo="body"></p-dropdown>
            </div>
            <div class="field col-12 md:col-4 flex flex-column gap-2">
                <label for="unitId" class="font-medium">Unit <span class="p-error">*</span></label>
                <p-dropdown inputId="unitId" [options]="units" [(ngModel)]="product.unitId"
                    optionLabel="name" optionValue="id" placeholder="Select unit"
                    [filter]="true" styleClass="w-full" [disabled]="saving" appendTo="body"></p-dropdown>
            </div>
        </div>

        <!-- Technical Specifications / Attributes -->
        <div class="surface-card p-3 border-round border-1 surface-border flex flex-column gap-2">
            <div class="flex align-items-center justify-content-between flex-wrap gap-2">
                <div class="flex align-items-center gap-2">
                    <i class="pi pi-sliders-h text-primary font-bold"></i>
                    <span class="font-semibold text-900">Technical Specifications</span>
                    <span class="text-xs text-500">(e.g. Solar, Battery, Mobile)</span>
                </div>
                <div class="flex align-items-center gap-1 flex-wrap">
                    <span class="text-xs text-500 mr-1">Presets:</span>
                    <button pButton type="button" label="⚡ Solar" class="p-button-outlined p-button-secondary py-1 px-2 text-xs"
                        (click)="applyPreset('solar')" [disabled]="saving" pTooltip="Add Solar Panel attributes"></button>
                    <button pButton type="button" label="🔋 Battery" class="p-button-outlined p-button-secondary py-1 px-2 text-xs"
                        (click)="applyPreset('battery')" [disabled]="saving" pTooltip="Add Battery attributes"></button>
                    <button pButton type="button" label="📱 Mobile" class="p-button-outlined p-button-secondary py-1 px-2 text-xs"
                        (click)="applyPreset('mobile')" [disabled]="saving" pTooltip="Add Mobile Phone attributes"></button>
                    <button pButton type="button" icon="pi pi-plus" label="Add Field" class="p-button-outlined p-button-primary py-1 px-2 text-xs ml-1"
                        (click)="addSpecItem()" [disabled]="saving"></button>
                </div>
            </div>

            <div *ngIf="specItems.length === 0" class="text-xs text-500 py-3 text-center surface-50 border-round">
                No specifications defined yet. Click a preset (⚡ Solar, 🔋 Battery, 📱 Mobile) or click "Add Field" to add custom attributes.
            </div>

            <div *ngIf="specItems.length > 0" class="flex flex-column gap-2 mt-2 max-h-16rem overflow-y-auto pr-1">
                <div *ngFor="let item of specItems; let i = index" class="grid grid-nogutter align-items-center gap-2">
                    <div class="col-12 sm:col-5">
                        <input type="text" pInputText [(ngModel)]="item.key" placeholder="Attribute name (e.g. Capacity, RAM)"
                            class="w-full p-inputtext-sm" [disabled]="saving" />
                    </div>
                    <div class="col">
                        <input type="text" pInputText [(ngModel)]="item.value" placeholder="Value (e.g. 550W, 128GB, With Water)"
                            class="w-full p-inputtext-sm" [disabled]="saving" />
                    </div>
                    <div class="col-fixed" style="width: 2.5rem;">
                        <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm p-0 w-full h-full"
                            (click)="removeSpecItem(i)" [disabled]="saving" pTooltip="Remove attribute"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <ng-template #loadingTpl>
        <div class="flex align-items-center justify-content-center p-4">
            <i class="pi pi-spin pi-spinner text-2xl"></i>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple type="button" label="Cancel" class="p-button-text"
            (click)="onHide()" [disabled]="saving"></button>
        <button pButton pRipple type="button" label="Save" icon="pi pi-check" class="p-button-primary"
            (click)="save()"
            [disabled]="saving || loading || !isFormValid"
            [loading]="saving"></button>
    </ng-template>
</p-dialog>
