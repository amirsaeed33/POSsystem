<div class="card">
    <p-table
        #dt
        [value]="tenants"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['tenancyName', 'name']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-20rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search tenants"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Add New"
                    class="p-button-outlined w-full sm:w-auto flex-order-0 sm:flex-order-1"
                    (click)="openCreateDialog()"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="tenancyName" class="white-space-nowrap">
                    Tenancy Name <p-sortIcon field="tenancyName"></p-sortIcon>
                </th>
                <th pSortableColumn="name" class="white-space-nowrap">
                    Name <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="isActive" class="white-space-nowrap">
                    Active <p-sortIcon field="isActive"></p-sortIcon>
                </th>
                <th class="text-center" style="width: 4.5rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-tenant>
            <tr>
                <td>{{ tenant.tenancyName }}</td>
                <td>{{ tenant.name }}</td>
                <td>
                    <span [class]="tenant.isActive ? 'p-tag p-tag-success' : 'p-tag p-tag-danger'">
                        {{ tenant.isActive ? 'Active' : 'Inactive' }}
                    </span>
                </td>
                <td class="text-center">
                    <div class="relative flex align-items-center justify-content-center">
                        <button
                            type="button"
                            class="p-link w-2rem h-2rem border-circle inline-flex align-items-center justify-content-center hover:surface-hover transition-colors transition-duration-150"
                            pStyleClass="@next"
                            enterClass="hidden"
                            enterActiveClass="scalein"
                            leaveToClass="hidden"
                            leaveActiveClass="fadeout"
                            [hideOnOutsideClick]="true"
                            pTooltip="Actions"
                            tooltipPosition="left"
                        >
                            <i class="pi pi-ellipsis-v text-color"></i>
                        </button>
                        <ul class="list-none p-2 m-0 border-round shadow-3 hidden absolute surface-overlay origin-top mt-1 right-0 top-auto tbl-action-dropdown-menu text-left">
                            <li>
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer"
                                   (click)="openEditDialog(tenant)">
                                    <i class="pi pi-pencil mr-2 text-blue-500"></i>
                                    <span>Edit</span>
                                </a>
                            </li>
                            <li>
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer text-red-500"
                                   (click)="onDelete(tenant)">
                                    <i class="pi pi-trash mr-2"></i>
                                    <span>Delete</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="text-center p-4">
                    <div class="text-500">No tenants found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-tenant-form-dialog
        [(visible)]="dialogVisible"
        [tenantId]="editingTenantId"
        (saved)="onDialogSaved()"
    ></app-tenant-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
