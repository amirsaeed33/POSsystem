<p-dialog
    [header]="dialogTitle"
    [(visible)]="visible"
    [modal]="true"
    appendTo="body"
    [blockScroll]="true"
    styleClass="dialog-sm"
    [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onHide()"
>
    <div *ngIf="loading" class="text-center p-4 text-500">Loading...</div>

    <div *ngIf="!loading" class="grid formgrid p-fluid">
        <div class="field col-12">
            <label for="productName">Product Name <span class="text-red-500">*</span></label>
            <input
                pInputText
                id="productName"
                type="text"
                placeholder="e.g. Rice, Chicken, Cooking Oil, Tomatoes"
                maxlength="256"
                [(ngModel)]="item.productName"
            />
        </div>

        <div class="field col-12">
            <label for="purchasePrice">Purchase Price <span class="text-red-500">*</span></label>
            <p-inputNumber
                inputId="purchasePrice"
                [(ngModel)]="item.purchasePrice"
                [min]="0.01"
                mode="decimal"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                [showButtons]="false"
                styleClass="w-full"
                placeholder="0.00"
            ></p-inputNumber>
        </div>

        <div class="field col-12">
            <label for="unit">Unit <span class="text-red-500">*</span></label>
            <p-dropdown
                inputId="unit"
                [options]="unitOptions"
                [(ngModel)]="selectedUnit"
                (onChange)="onUnitChange($event)"
                [editable]="true"
                placeholder="Select or enter unit (e.g. kg, gram, litre, piece)"
                appendTo="body"
            ></p-dropdown>
        </div>

        <div class="field col-12">
            <label for="purchaseDate">Purchase Date <span class="text-red-500">*</span></label>
            <input
                pInputText
                id="purchaseDate"
                type="date"
                [(ngModel)]="purchaseDateString"
            />
        </div>
    </div>

    <ng-template pTemplate="footer">
        <button
            pButton
            pRipple
            type="button"
            label="Cancel"
            class="p-button-text"
            [disabled]="saving"
            (click)="onHide()"
        ></button>
        <button
            pButton
            pRipple
            type="button"
            label="Save"
            class="p-button-primary font-semibold"
            [loading]="saving"
            (click)="save()"
        ></button>
    </ng-template>
</p-dialog>
