<div [ngClass]="{ card: !embedded }">
    <p-table
        #dt
        [value]="records"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['staffName', 'branchName', 'remarks']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-16rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <p-dropdown
                        [options]="staffOptions"
                        [(ngModel)]="staffFilter"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Staff"
                        [showClear]="true"
                        styleClass="w-12rem"
                        (onChange)="onSearch()"
                    ></p-dropdown>
                    <p-dropdown
                        [options]="statusOptions"
                        [(ngModel)]="statusFilter"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Status"
                        styleClass="w-10rem"
                        (onChange)="onSearch()"
                    ></p-dropdown>
                    <input
                        pInputText
                        type="date"
                        class="w-10rem"
                        [(ngModel)]="fromDate"
                        (change)="onSearch()"
                    />
                    <input
                        pInputText
                        type="date"
                        class="w-10rem"
                        [(ngModel)]="toDate"
                        (change)="onSearch()"
                    />
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Mark Attendance"
                    class="p-button-primary w-full sm:w-auto flex-order-0 sm:flex-order-1 font-semibold"
                    (click)="openCreateDialog()"
                    [disabled]="!canCreate"
                    [pTooltip]="!canCreate ? 'You do not have permission to Mark Attendance' : ''"
                    tooltipPosition="top"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="staffName" class="white-space-nowrap">
                    Staff Name <p-sortIcon field="staffName"></p-sortIcon>
                </th>
                <th pSortableColumn="date" class="white-space-nowrap">
                    Date <p-sortIcon field="date"></p-sortIcon>
                </th>
                <th pSortableColumn="status" class="white-space-nowrap">
                    Status <p-sortIcon field="status"></p-sortIcon>
                </th>
                <th pSortableColumn="checkInTime" class="white-space-nowrap">
                    Check In <p-sortIcon field="checkInTime"></p-sortIcon>
                </th>
                <th pSortableColumn="checkOutTime" class="white-space-nowrap">
                    Check Out <p-sortIcon field="checkOutTime"></p-sortIcon>
                </th>
                <th class="white-space-nowrap" style="width: 8rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-att>
            <tr>
                <td>{{ att.staffName || '—' }}</td>
                <td>{{ att.date | date: 'mediumDate' }}</td>
                <td>
                    <span
                        class="px-2 py-1 border-round font-bold text-xs"
                        [ngClass]="{
                            'bg-green-100 text-green-700': att.status === 'Present',
                            'bg-red-100 text-red-700': att.status === 'Absent',
                            'bg-yellow-100 text-yellow-700': att.status === 'Leave' || att.status === 'Late'
                        }"
                    >
                        {{ att.status }}
                    </span>
                </td>
                <td>{{ att.checkInTime || '—' }}</td>
                <td>{{ att.checkOutTime || '—' }}</td>
                <td>
                    <div class="flex gap-2">
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-pencil"
                            class="tbl-action-btn edit-btn"
                            [pTooltip]="!canEdit ? 'You do not have permission to Edit' : 'Edit'"
                            tooltipPosition="top"
                            (click)="openEditDialog(att)"
                            [disabled]="!canEdit"
                        ></button>
                        <button
                            pButton
                            pRipple
                            type="button"
                            icon="pi pi-trash"
                            class="tbl-action-btn delete-btn"
                            [pTooltip]="!canDelete ? 'You do not have permission to Delete' : 'Delete'"
                            tooltipPosition="top"
                            (click)="onDelete(att)"
                            [disabled]="!canDelete"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="9" class="text-center p-4">
                    <div class="text-500">No attendance records found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-staff-attendance-form-dialog
        [(visible)]="dialogVisible"
        [attendanceId]="editingId"
        (saved)="onDialogSaved()"
    ></app-staff-attendance-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
