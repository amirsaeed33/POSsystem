<div [ngClass]="{ card: !embedded }">
    <p-table
        #dt
        [value]="rows"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} employees"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['staffName', 'branchName']"
        [totalRecords]="totalRecords"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-16rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search employee"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <input
                        pInputText
                        type="date"
                        class="w-10rem"
                        [(ngModel)]="attendanceDate"
                        (change)="onSearch()"
                        title="Attendance date"
                    />
                    <p-dropdown
                        [options]="staffOptions"
                        [(ngModel)]="staffFilter"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="All employees"
                        [showClear]="true"
                        [filter]="true"
                        styleClass="w-12rem"
                        (onChange)="onSearch()"
                    ></p-dropdown>
                    <p-dropdown
                        [options]="statusOptions"
                        [(ngModel)]="statusFilter"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Status"
                        styleClass="w-10rem"
                        (onChange)="onSearch()"
                    ></p-dropdown>
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Mark Attendance"
                    class="p-button-primary w-full sm:w-auto flex-order-0 sm:flex-order-1 font-semibold"
                    (click)="openCreateDialog()"
                    [disabled]="!canCreate"
                    [pTooltip]="!canCreate ? 'You do not have permission to Mark Attendance' : ''"
                    tooltipPosition="top"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="staffName" class="white-space-nowrap">
                    Staff Name <p-sortIcon field="staffName"></p-sortIcon>
                </th>
                <th class="white-space-nowrap">Date</th>
                <th class="white-space-nowrap">Status</th>
                <th class="white-space-nowrap">Check In</th>
                <th class="white-space-nowrap">Check Out</th>
                <th class="text-center" style="width: 4.5rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
            <tr>
                <td>{{ row.staffName || '—' }}</td>
                <td>{{ formatDate(row.attendanceDate) }}</td>
                <td>
                    <span
                        class="px-2 py-1 border-round font-bold text-xs"
                        [ngClass]="{
                            'bg-green-100 text-green-700': row.attendance && +row.attendance.status === 0,
                            'bg-red-100 text-red-700': row.attendance && +row.attendance.status === 1,
                            'bg-yellow-100 text-yellow-700': row.attendance && +row.attendance.status === 2,
                            'bg-blue-100 text-blue-700': row.attendance && +row.attendance.status === 3,
                            'bg-gray-100 text-gray-600': !row.attendance
                        }"
                    >
                        {{ row.attendance ? statusLabel(row.attendance.status) : 'Not marked' }}
                    </span>
                </td>
                <td>{{ formatTime(row.attendance?.checkInTime) }}</td>
                <td>{{ formatTime(row.attendance?.checkOutTime) }}</td>
                <td class="text-center">
                    <app-row-actions [items]="getRowActions(row)"></app-row-actions>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center p-4">
                    <div class="text-500">No employees found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-staff-attendance-form-dialog
        [(visible)]="dialogVisible"
        [attendanceId]="editingId"
        [defaultStaffId]="dialogStaffId"
        [defaultDate]="dialogDate"
        (saved)="onDialogSaved()"
    ></app-staff-attendance-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
