<div [ngClass]="{ card: !embedded }">
    <p-table
        #dt
        [value]="records"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        responsiveLayout="scroll"
        [loading]="loading"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
        [globalFilterFields]="['staffName', 'branchName', 'remarks']"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="flex flex-wrap gap-2 align-items-center flex-order-1 sm:flex-order-0">
                    <span class="p-input-icon-left w-full sm:w-16rem">
                        <i class="pi pi-search"></i>
                        <input
                            pInputText
                            type="text"
                            class="w-full"
                            placeholder="Search"
                            [(ngModel)]="keyword"
                            (keyup.enter)="onSearch()"
                            (input)="onGlobalFilter(dt, $event)"
                        />
                    </span>
                    <p-dropdown
                        [options]="staffOptions"
                        [(ngModel)]="staffFilter"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Staff"
                        [showClear]="true"
                        styleClass="w-12rem"
                        (onChange)="onSearch()"
                    ></p-dropdown>
                    <p-dropdown
                        [options]="statusOptions"
                        [(ngModel)]="statusFilter"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Status"
                        styleClass="w-10rem"
                        (onChange)="onSearch()"
                    ></p-dropdown>
                    <input
                        pInputText
                        type="date"
                        class="w-10rem"
                        [(ngModel)]="fromDate"
                        (change)="onSearch()"
                    />
                    <input
                        pInputText
                        type="date"
                        class="w-10rem"
                        [(ngModel)]="toDate"
                        (change)="onSearch()"
                    />
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-search"
                        class="p-button-outlined"
                        label="Search"
                        (click)="onSearch()"
                    ></button>
                </div>
                <button
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-plus"
                    label="Mark Attendance"
                    class="p-button-primary w-full sm:w-auto flex-order-0 sm:flex-order-1 font-semibold"
                    (click)="openCreateDialog()"
                    [disabled]="!canCreate"
                    [pTooltip]="!canCreate ? 'You do not have permission to Mark Attendance' : ''"
                    tooltipPosition="top"
                ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="staffName" class="white-space-nowrap">
                    Staff Name <p-sortIcon field="staffName"></p-sortIcon>
                </th>
                <th pSortableColumn="date" class="white-space-nowrap">
                    Date <p-sortIcon field="date"></p-sortIcon>
                </th>
                <th pSortableColumn="status" class="white-space-nowrap">
                    Status <p-sortIcon field="status"></p-sortIcon>
                </th>
                <th pSortableColumn="checkInTime" class="white-space-nowrap">
                    Check In <p-sortIcon field="checkInTime"></p-sortIcon>
                </th>
                <th pSortableColumn="checkOutTime" class="white-space-nowrap">
                    Check Out <p-sortIcon field="checkOutTime"></p-sortIcon>
                </th>
                <th class="text-center" style="width: 4.5rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-att>
            <tr>
                <td>{{ att.staffName || '—' }}</td>
                <td>{{ att.date | date: formatService.dateFormat }}</td>
                <td>
                    <span
                        class="px-2 py-1 border-round font-bold text-xs"
                        [ngClass]="{
                            'bg-green-100 text-green-700': att.status === 'Present',
                            'bg-red-100 text-red-700': att.status === 'Absent',
                            'bg-yellow-100 text-yellow-700': att.status === 'Leave' || att.status === 'Late'
                        }"
                    >
                        {{ att.status }}
                    </span>
                </td>
                <td>{{ att.checkInTime || '—' }}</td>
                <td>{{ att.checkOutTime || '—' }}</td>
                <td class="text-center">
                    <div class="relative flex align-items-center justify-content-center">
                        <button
                            type="button"
                            class="p-link w-2rem h-2rem border-circle inline-flex align-items-center justify-content-center hover:surface-hover transition-colors transition-duration-150"
                            pStyleClass="@next"
                            enterClass="hidden"
                            enterActiveClass="scalein"
                            leaveToClass="hidden"
                            leaveActiveClass="fadeout"
                            [hideOnOutsideClick]="true"
                            pTooltip="Actions"
                            tooltipPosition="left"
                        >
                            <i class="pi pi-ellipsis-v text-color"></i>
                        </button>
                        <ul class="list-none p-2 m-0 border-round shadow-3 hidden absolute surface-overlay origin-top mt-1 right-0 top-auto tbl-action-dropdown-menu text-left">
                            <li *ngIf="canEdit">
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer"
                                   (click)="openEditDialog(att)">
                                    <i class="pi pi-pencil mr-2 text-blue-500"></i>
                                    <span>Edit</span>
                                </a>
                            </li>
                            <li *ngIf="canDelete">
                                <a pRipple class="flex p-2 border-round align-items-center hover:surface-hover transition-colors transition-duration-150 cursor-pointer text-red-500"
                                   (click)="onDelete(att)">
                                    <i class="pi pi-trash mr-2"></i>
                                    <span>Delete</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="9" class="text-center p-4">
                    <div class="text-500">No attendance records found</div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-staff-attendance-form-dialog
        [(visible)]="dialogVisible"
        [attendanceId]="editingId"
        (saved)="onDialogSaved()"
    ></app-staff-attendance-form-dialog>

    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
</div>
