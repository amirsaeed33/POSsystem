<form
  class="form-horizontal"
  autocomplete="off"
  #createCompanyProfileForm="ngForm"
  (ngSubmit)="save()"
>
  <abp-modal-header
    [title]="'CreateNewCompanyProfile' | localize"
    (onCloseClick)="bsModalRef.hide()"
  ></abp-modal-header>
  <div class="modal-body">
    <div class="form-group row required">
      <label class="col-md-3 col-form-label" for="softwareName">
        {{ "SoftwareName" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          name="softwareName"
          id="softwareName"
          maxlength="128"
          required
          [(ngModel)]="companyProfile.name"
          #nameModel="ngModel"
          #nameEl
        />
        <abp-validation-summary
          [control]="nameModel"
          [controlEl]="nameEl"
        ></abp-validation-summary>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="companyImage">
        {{ "CompanyImage" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="file"
          class="form-control-file"
          id="companyImage"
          accept="image/*"
          (change)="onFileSelected($event)"
        />
        @if (imagePreview) {
          <img
            [src]="imagePreview"
            alt="preview"
            class="mt-2"
            style="max-width: 160px; max-height: 160px; object-fit: cover;"
          />
        }
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="invoiceAddress">
        {{ "InvoiceAddress" | localize }}
      </label>
      <div class="col-md-9">
        <textarea
          class="form-control"
          name="invoiceAddress"
          id="invoiceAddress"
          maxlength="512"
          rows="2"
          [(ngModel)]="companyProfile.invoiceAddress"
        ></textarea>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="invoiceContactEmail">
        {{ "InvoiceContactEmail" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="email"
          class="form-control"
          name="invoiceContactEmail"
          id="invoiceContactEmail"
          maxlength="256"
          email
          [(ngModel)]="companyProfile.invoiceContactEmail"
          #emailModel="ngModel"
          #emailEl
        />
        <abp-validation-summary
          [control]="emailModel"
          [controlEl]="emailEl"
        ></abp-validation-summary>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="invoiceContactPhone">
        {{ "InvoiceContactPhone" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          name="invoiceContactPhone"
          id="invoiceContactPhone"
          maxlength="32"
          [(ngModel)]="companyProfile.invoiceContactPhone"
        />
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="taxNumber">
        {{ "TaxNumber" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          name="taxNumber"
          id="taxNumber"
          maxlength="64"
          [(ngModel)]="companyProfile.taxNumber"
        />
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="website">
        {{ "Website" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          name="website"
          id="website"
          maxlength="256"
          [(ngModel)]="companyProfile.website"
        />
      </div>
    </div>
    <div class="form-group row mb-0">
      <label class="col-md-3 col-form-label" for="invoiceFooter">
        {{ "InvoiceFooter" | localize }}
      </label>
      <div class="col-md-9">
        <textarea
          class="form-control"
          name="invoiceFooter"
          id="invoiceFooter"
          maxlength="512"
          rows="2"
          [(ngModel)]="companyProfile.invoiceFooter"
        ></textarea>
      </div>
    </div>
  </div>
  <abp-modal-footer
    [cancelDisabled]="saving"
    [saveDisabled]="!createCompanyProfileForm.form.valid || saving"
    (onCancelClick)="bsModalRef.hide()"
  ></abp-modal-footer>
</form>
