<form
  class="form-horizontal"
  autocomplete="off"
  #editAccountForm="ngForm"
  (ngSubmit)="save()"
>
  <abp-modal-header
    [title]="'EditAccount' | localize"
    (onCloseClick)="bsModalRef.hide()"
  ></abp-modal-header>
  <div class="modal-body">
    <div class="form-group row required">
      <label class="col-md-3 col-form-label" for="accountName">
        {{ "Name" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          name="accountName"
          id="accountName"
          maxlength="128"
          required
          [(ngModel)]="account.name"
          #nameModel="ngModel"
          #nameEl
        />
        <abp-validation-summary
          [control]="nameModel"
          [controlEl]="nameEl"
        ></abp-validation-summary>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="code">
        {{ "AccountCode" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          name="code"
          id="code"
          maxlength="64"
          [(ngModel)]="account.code"
        />
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="accountType">
        {{ "AccountType" | localize }}
      </label>
      <div class="col-md-9">
        <ng-select [fixedPlaceholder]="false"
          [items]="accountTypes"
          [(ngModel)]="account.accountType"
          name="accountType"
          id="accountType"
          [placeholder]="'AccountType' | localize"
          appendTo="body"
          [clearable]="true"
        ></ng-select>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="openingBalance">
        {{ "OpeningBalance" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="number"
          class="form-control"
          name="openingBalance"
          id="openingBalance"
          step="0.01"
          [(ngModel)]="account.openingBalance"
        />
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label" for="description">
        {{ "Description" | localize }}
      </label>
      <div class="col-md-9">
        <textarea
          class="form-control"
          name="description"
          id="description"
          maxlength="512"
          rows="2"
          [(ngModel)]="account.description"
        ></textarea>
      </div>
    </div>
    <div class="form-group row mb-0">
      <label class="col-md-3 col-form-label">
        {{ "IsActive" | localize }}
      </label>
      <div class="col-md-9">
        <div class="custom-control custom-checkbox">
          <input
            type="checkbox"
            class="custom-control-input"
            name="isActive"
            id="isActive"
            [(ngModel)]="account.isActive"
          />
          <label class="custom-control-label mt-2" for="isActive"></label>
        </div>
      </div>
    </div>
  </div>
  <abp-modal-footer
    [cancelDisabled]="saving"
    [saveDisabled]="!editAccountForm.form.valid || saving"
    (onCancelClick)="bsModalRef.hide()"
  ></abp-modal-footer>
</form>
